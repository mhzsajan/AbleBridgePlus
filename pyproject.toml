[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ablebridge-plus"
version = "0.5.0"
description = "AI-integrated live show engineering system for Ableton Live"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sajan Maharjan" }]
requires-python = ">=3.10"
keywords = ["ableton", "music", "production", "live-show", "mcp", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

dependencies = [
    "mcp>=0.1.0,<2",
    "aiohttp>=3.8.0",
    "python-osc>=1.8.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/mhzsajan/ablebridge-plus"
Repository = "https://github.com/mhzsajan/ablebridge-plus"
Issues = "https://github.com/mhzsajan/ablebridge-plus/issues"

[project.scripts]
ablebridge-plus = "MCP_Server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["MCP_Server", "AbleBridgePlus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
