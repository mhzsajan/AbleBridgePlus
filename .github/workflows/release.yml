name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Create release package
        run: |
          # Create release directory
          mkdir -p release-package

          # Copy necessary files
          cp -r MCP_Server release-package/
          cp -r AbleBridgePlus release-package/
          cp -r M4L_Device release-package/
          cp -r midi_cc release-package/
          cp -r docs release-package/
          cp -r tests release-package/
          cp -r examples release-package/
          cp -r release release-package/
          cp -r scripts release-package/
          cp README.md release-package/
          cp LICENSE release-package/
          cp CHANGELOG.md release-package/
          cp pyproject.toml release-package/
          cp uv.lock release-package/

          # Create Windows ZIP
          zip -r ablebridge-windows.zip release-package/

          # Create tar.gz for Linux/macOS
          tar -czf ablebridge-linux.tar.gz release-package/

          # Clean up
          rm -rf release-package

      - name: Extract changelog section for this tag
        run: |
          python3 - <<'PYEOF'
          import re
          tag = "${{ github.ref_name }}".lstrip("v")
          txt = open("CHANGELOG.md", encoding="utf-8").read()
          # find the section for this version, up to the next '## [' header
          m = re.search(r"## \[" + re.escape(tag) + r"\][^\n]*\n(.*?)(?=\n## \[|\Z)", txt, re.S)
          section = m.group(1).strip() if m else "See [CHANGELOG.md](https://github.com/mhzsajan/AbleBridgePlus/blob/master/CHANGELOG.md) for details."
          with open("release_section.md", "w", encoding="utf-8") as f:
              f.write(section)
          print("extracted", len(section), "chars for", tag)
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ablebridge-windows.zip
            ablebridge-linux.tar.gz
          body_path: release_section.md
          append_body: true
          header: |
            ## AbleBridgePlus v${{ github.ref_name }}

            MCP bridge connecting AI/LLM tools to Ableton Live — AI-assisted music production and real-time show control.

      - name: Append install + docs links to the release
        run: |
          python3 - <<'PYEOF'
          import json, os, time, urllib.request, urllib.error

          tag = "${{ github.ref_name }}"
          token = "${{ secrets.GITHUB_TOKEN }}"
          repo = "${{ github.repository }}"
          url = "https://api.github.com/repos/{0}/releases/tags/{1}".format(repo, tag)
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
          })
          release = None
          for attempt in range(12):
              try:
                  release = json.loads(urllib.request.urlopen(req).read())
                  break
              except urllib.error.HTTPError as e:
                  if e.code == 404 and attempt < 11:
                      time.sleep(5)  # release propagation race; retry
                  else:
                      raise
          if release is None:
              raise SystemExit("Release not found after retries")

          trailer = """

          ### Quick Install

          **Windows:**
          1. Download `ablebridge-windows.zip`
          2. Extract and run `install.bat`

          **macOS/Linux:**
          1. Download `ablebridge-linux.tar.gz`
          2. Extract and run `./install.sh`

          ### Documentation
          - [Installation Guide](https://github.com/mhzsajan/AbleBridgePlus/blob/master/docs/INSTALLATION.md)
          - [Features](https://github.com/mhzsajan/AbleBridgePlus/blob/master/docs/FEATURES.md)
          - [Architecture](https://github.com/mhzsajan/AbleBridgePlus/blob/master/docs/ARCHITECTURE.md)

          ### Credits
          Based on [AbletonBridge](https://github.com/hidingwill/AbletonBridge) by [hidingwill](https://github.com/hidingwill).
          """
          body = (release.get("body") or "") + trailer
          patch = json.dumps({"body": body}).encode()
          req = urllib.request.Request(url, data=patch, method="PATCH", headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          })
          for attempt in range(12):
              try:
                  urllib.request.urlopen(req)
                  break
              except urllib.error.HTTPError as e:
                  if e.code == 404 and attempt < 11:
                      time.sleep(5)  # same propagation race as the GET above
                  else:
                      raise
          print("release body updated:", len(body), "chars")
          PYEOF

      - name: Publish to Codeberg (mirror release)
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "Release Bot"

          TAG="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          # Clone the Codeberg mirror and pin the exact commit the GitHub
          # tag points at — fails loudly if the mirror is out of sync.
          git clone "https://mhzsajan:${CODEBERG_TOKEN}@codeberg.org/mhzsajan/AbleBridgePlus.git" codeberg-repo
          cd codeberg-repo
          git checkout "$SHA"
          git tag "$TAG"
          git push origin "$TAG"

          # Create the release with the changelog section extracted earlier
          python3 - <<'PYEOF'
          import json, os, time, urllib.request, urllib.error

          tag = os.environ["TAG"]
          token = os.environ["CODEBERG_TOKEN"]
          api = "https://codeberg.org/api/v1/repos/mhzsajan/AbleBridgePlus/releases"

          section = open("../release_section.md", encoding="utf-8").read().strip()
          trailer = """

          ### Quick Install

          **Windows:**
          1. Download `ablebridge-windows.zip`
          2. Extract and run `install.bat`

          **macOS/Linux:**
          1. Download `ablebridge-linux.tar.gz`
          2. Extract and run `./install.sh`

          ### Documentation
          - [Installation Guide](https://codeberg.org/mhzsajan/AbleBridgePlus/src/branch/master/docs/INSTALLATION.md)
          - [Features](https://codeberg.org/mhzsajan/AbleBridgePlus/src/branch/master/docs/FEATURES.md)
          - [Full Changelog](https://codeberg.org/mhzsajan/AbleBridgePlus/src/branch/master/CHANGELOG.md)

          ### Credits
          Based on [AbletonBridge](https://github.com/hidingwill/AbletonBridge) by hidingwill.
          Built and maintained by Sajan Maharjan.
          """
          payload = json.dumps({
              "tag_name": tag,
              "name": tag,
              "body": "# AbleBridgePlus " + tag + "\n\n" + section + trailer,
              "draft": False,
              "prerelease": False,
          }).encode()

          def api_call(req):
              for attempt in range(12):
                  try:
                      return urllib.request.urlopen(req).read()
                  except urllib.error.HTTPError as e:
                      if e.code == 404 and attempt < 11:
                          time.sleep(5)  # tag propagation delay
                      else:
                          raise
              raise SystemExit("Codeberg API unreachable after retries")

          req = urllib.request.Request(api, data=payload, method="POST", headers={
              "Authorization": "token " + token,
              "Content-Type": "application/json",
          })
          release = json.loads(api_call(req))
          rid = release["id"]
          print("codeberg release created, id", rid)

          for asset, name in (("../ablebridge-windows.zip", "ablebridge-windows.zip"),
                              ("../ablebridge-linux.tar.gz", "ablebridge-linux.tar.gz")):
              data = open(asset, "rb").read()
              req = urllib.request.Request(
                  api + "/{}".format(rid) + "/assets?name=" + name,
                  data=data, method="POST",
                  headers={"Authorization": "token " + token,
                           "Content-Type": "application/octet-stream"})
              result = json.loads(api_call(req))
              print("uploaded:", result.get("name"), result.get("size"))
          PYEOF
