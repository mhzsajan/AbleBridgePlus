name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Create release package
        run: |
          # Create release directory
          mkdir -p release-package

          # Copy necessary files
          cp -r MCP_Server release-package/
          cp -r AbletonBridge_Remote_Script release-package/
          cp -r M4L_Device release-package/
          cp -r midi_cc release-package/
          cp -r docs release-package/
          cp -r tests release-package/
          cp -r examples release-package/
          cp -r release release-package/
          cp -r scripts release-package/
          cp README.md release-package/
          cp LICENSE release-package/
          cp CHANGELOG.md release-package/
          cp pyproject.toml release-package/
          cp uv.lock release-package/

          # Create Windows ZIP
          zip -r ablebridge-windows.zip release-package/

          # Create tar.gz for Linux/macOS
          tar -czf ablebridge-linux.tar.gz release-package/

          # Clean up
          rm -rf release-package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ablebridge-windows.zip
            ablebridge-linux.tar.gz
          body: |
            ## AbleBridge++ v${{ github.ref_name }}

            MCP bridge connecting AI/LLM tools to Ableton Live — **417 tools registered** for AI-assisted music production and real-time show control.

            ### What's New in v0.3.0
            - **Full core toolset port** from original AbletonBridge (293 tools): clips, session, tracks, mixer, browser, arrangement, automation, creative, grid, scenes, snapshots, workflows
            - **Live Show Control**: emergency stop / panic mute, session backup/restore, scene macros, backup presets
            - **Performance analytics**: session/track stats, trends, peak/average levels, export reports
            - **Audio presets**: reverb, delay, compressor, EQ save/load
            - **Video/Lighting**: video presets, transitions, DMX channel control, lighting scenes
            - **AI enhancement**: genre suggestions, auto gain staging, mix optimization
            - **Browser cache**: instant search, disk cache, URI resolution for samples/devices
            - **Robust connection layer**: retry/reconnect, command delay tiers, per-command timeouts
            - **29 tests** (all passing)

            ### Full changelog
            See [CHANGELOG.md](https://github.com/mhzsajan/ablebridge-dev/blob/master/CHANGELOG.md) for the complete history.

            ### Quick Install

            **Windows:**
            1. Download `ablebridge-windows.zip`
            2. Extract and run `install.bat`

            **macOS/Linux:**
            1. Download `ablebridge-linux.tar.gz`
            2. Extract and run `./install.sh`

            ### Documentation
            - [Installation Guide](https://github.com/mhzsajan/ablebridge-dev/blob/master/docs/INSTALLATION.md)
            - [Features](https://github.com/mhzsajan/ablebridge-dev/blob/master/docs/FEATURES.md)
            - [Architecture](https://github.com/mhzsajan/ablebridge-dev/blob/master/docs/ARCHITECTURE.md)

            ### Credits
            Based on [AbletonBridge](https://github.com/hidingwill/AbletonBridge) by [hidingwill](https://github.com/hidingwill).